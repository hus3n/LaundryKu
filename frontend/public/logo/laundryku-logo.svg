<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logoGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="logoWaterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="textKuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(2, 2)">
    <!-- Base Squircle Container -->
    <rect x="4" y="4" width="52" height="52" rx="14" fill="url(#logoBgGrad)" filter="url(#logoShadow)" />
    <!-- Highlight -->
    <rect x="4" y="4" width="52" height="22" rx="14" fill="url(#logoGlowGrad)" />
    <!-- Washer Body Inset -->
    <rect x="8" y="8" width="44" height="44" rx="10" fill="#0f172a" fill-opacity="0.15" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
    <!-- Top Controls -->
    <circle cx="15" cy="15" r="2" fill="#ffffff" />
    <circle cx="21" cy="15" r="1.8" fill="rgba(255,255,255,0.6)" />
    <circle cx="26" cy="15" r="1.8" fill="rgba(255,255,255,0.4)" />
    <line x1="36" y1="15" x2="44" y2="15" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
    <!-- Drum Outer Ring -->
    <circle cx="30" cy="35" r="15" fill="#0b1329" stroke="rgba(255,255,255,0.85)" stroke-width="2" />
    <circle cx="30" cy="35" r="12" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="1.2" stroke-dasharray="3 2" />
    <!-- Water Wave -->
    <path d="M 18 37 Q 24 33 30 37 T 42 37 A 12 12 0 0 1 18 37 Z" fill="url(#logoWaterGrad)" />
    <!-- Bubbles -->
    <circle cx="30" cy="35" r="3.5" fill="#38bdf8" fill-opacity="0.8" />
    <circle cx="30" cy="35" r="1.5" fill="#ffffff" />
    <circle cx="25" cy="31" r="1.8" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="35" cy="32" r="1.2" fill="#ffffff" fill-opacity="0.6" />
    <!-- Sparkle -->
    <path d="M 48 7 Q 48 11 44 11 Q 48 11 48 15 Q 48 11 52 11 Q 48 11 48 7 Z" fill="#ffffff" />
  </g>

  <!-- Typography: LaundryKu -->
  <g transform="translate(68, 0)">
    <!-- Laundry (White/Light Slate) -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Laundry<tspan fill="url(#textKuGrad)">Ku</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2">
      SISTEM POS DIGITAL
    </text>
  </g>
</svg>
