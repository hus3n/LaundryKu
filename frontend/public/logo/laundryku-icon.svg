<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle Container with Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Top Highlight -->
  <rect x="4" y="4" width="56" height="24" rx="16" fill="url(#glowGrad)" />

  <!-- Washer Body Inset -->
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#0f172a" fill-opacity="0.15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Top Dashboard Controls (Buttons & Status) -->
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" />
  <circle cx="23" cy="16" r="2" fill="rgba(255,255,255,0.6)" />
  <circle cx="29" cy="16" r="2" fill="rgba(255,255,255,0.4)" />
  <line x1="40" y1="16" x2="48" y2="16" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Washing Drum Outer Ring -->
  <circle cx="32" cy="37" r="17" fill="#0b1329" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" />
  <circle cx="32" cy="37" r="13.5" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Water Wave inside Drum -->
  <path d="M 19 39 Q 25 34 32 39 T 45 39 A 13.5 13.5 0 0 1 19 39 Z" fill="url(#waterGrad)" />

  <!-- Drum Center Spin & Bubbles -->
  <circle cx="32" cy="37" r="4.5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="32" cy="37" r="2" fill="#ffffff" />
  <circle cx="26" cy="32" r="2" fill="#ffffff" fill-opacity="0.75" />
  <circle cx="38" cy="33" r="1.5" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="27" cy="42" r="1.2" fill="#ffffff" fill-opacity="0.5" />

  <!-- Sparkle top-right -->
  <path d="M 52 8 Q 52 13 47 13 Q 52 13 52 18 Q 52 13 57 13 Q 52 13 52 8 Z" fill="#ffffff" />
</svg>
